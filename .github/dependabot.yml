version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore(deps)
    groups:
      nextjs-and-react:
        patterns:
          - next
          - react
          - react-dom
      hardhat:
        patterns:
          - hardhat
          - '@nomicfoundation/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore(actions)
