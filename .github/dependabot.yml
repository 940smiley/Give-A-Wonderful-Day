version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "automerge"
    commit-message:
      prefix: "chore(deps)"
    groups:
      nextjs-and-react:
        patterns:
          - "react"
          - "react-dom"
          - "next"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "chore(actions)"
