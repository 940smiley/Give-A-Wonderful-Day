name: Repository Maintenance Report

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate open PR/issue report and apply basic labels
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const pr of pulls) {
              const labels = (pr.labels || []).map(l => l.name);
              if (/dependabot/i.test(pr.user?.login || '') && !labels.includes('dependencies')) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: ['dependencies'],
                });
              }
            }

            const issueOnly = issues.filter(i => !i.pull_request);
            const body = [
              '## Automated Maintenance Snapshot',
              `- Open PRs: ${pulls.length}`,
              `- Open Issues: ${issueOnly.length}`,
              `- Generated: ${new Date().toISOString()}`,
              '',
              '### Open PRs',
              ...pulls.slice(0, 20).map(pr => `- #${pr.number} ${pr.title}`),
              '',
              '### Open Issues',
              ...issueOnly.slice(0, 20).map(i => `- #${i.number} ${i.title}`),
            ].join('\n');

            const title = `Maintenance snapshot (${new Date().toISOString().slice(0, 10)})`;
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
            });
