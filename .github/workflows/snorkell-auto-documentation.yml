name: Documentation

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Generate documentation
        uses: Penify-dev/penifydocwf@v1.0.0
        with:
          client_id: ${{ secrets.SNORKELL_CLIENT_ID }}
          api_key: ${{ secrets.SNORKELL_API_KEY }}
          branch_name: main
