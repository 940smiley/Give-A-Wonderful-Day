name: Autonomous PR Repair Agent

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  repair-and-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout default branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Self-repair dependency artifacts
        run: |
          npm audit fix || true
          npm install --package-lock-only || true

      - name: Verify repository health
        run: npm run check

      - name: Commit automated repairs (same-repo PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: autonomous repair (deps + checks)"
          file_pattern: package-lock.json package.json

  summarize-open-items:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize open PRs and issues
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const issueOnly = issues.filter(i => !i.pull_request);
            core.summary
              .addHeading('Autonomous Repository Snapshot')
              .addRaw(`Open PRs: ${pulls.length}\n`)
              .addRaw(`Open Issues: ${issueOnly.length}\n`)
              .write();
